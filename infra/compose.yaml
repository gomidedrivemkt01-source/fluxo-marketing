services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      APP_PUBLIC_URL: http://localhost:8000
      APP_DATABASE_URL: postgresql+psycopg://marketing:marketing@db:5432/marketing
      APP_COOKIE_SECURE: "false"
      APP_ALLOWED_ORIGINS: '["http://localhost:8000","http://localhost:5173"]'
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketing
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - marketing-db:/var/lib/postgresql/data

volumes:
  marketing-db:

