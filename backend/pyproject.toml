[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxo-marketing-api"
version = "0.1.0"
description = "API da plataforma interna de Marketing Operations"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "cryptography>=46,<47",
  "email-validator>=2.3,<3",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest==9.1.1",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
  "B008", # FastAPI usa Depends/Query nos valores padrão por design.
  "E501", # O formatador cuida do código; migrações mantêm SQL legível em uma linha.
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
