services:
  - type: web
    name: fluxo-marketing
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Fluxo Marketing
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_PUBLIC_URL
        sync: false
      - key: APP_DATABASE_HOST
        value: aws-0-sa-east-1.pooler.supabase.com
      - key: APP_DATABASE_PORT
        value: "5432"
      - key: APP_DATABASE_NAME
        value: postgres
      - key: APP_DATABASE_USER
        value: postgres.xtsbravvqeibkiuybhty
      - key: APP_DATABASE_SSLMODE
        value: require
      - key: APP_DATABASE_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_SUPABASE_URL
        sync: false
      - key: APP_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_STORAGE_BUCKET
        value: demand-files
      - key: APP_STORAGE_MAX_FILE_SIZE
        value: "26214400"
      - key: APP_STORAGE_SIGNED_URL_TTL
        value: "120"
      - key: APP_BOOTSTRAP_ORGANIZATION_NAME
        value: Marketing
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: APP_ALLOWED_ORIGINS
        sync: false
