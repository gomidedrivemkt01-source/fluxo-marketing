# Fluxo Marketing — aplicação + PostgreSQL + backup diário
# Uso: cp .env.example .env  (preencha as senhas)  &&  docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketing
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: fluxo-marketing:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://marketing:${DB_SENHA}@db:5432/marketing
      APP_STORAGE_DIR: /app/storage
      PORT: "8000"
      TZ: America/Sao_Paulo
    volumes:
      - arquivos:/app/storage
    ports:
      - "${PORTA:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: marketing
      PGDATABASE: marketing
      PGPASSWORD: ${DB_SENHA}
      BACKUP_HORA: ${BACKUP_HORA:-23}
      BACKUP_DIAS: ${BACKUP_DIAS:-30}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - arquivos:/arquivos:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  pgdata:
  arquivos:
